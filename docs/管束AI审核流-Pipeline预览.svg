<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1420" viewBox="0 0 920 1420">
  <rect width="920" height="1420" fill="#fff"/>
  <text x="80" y="60" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1f3763">管束 AI Agent</text>
  <circle cx="460" cy="135" r="22" fill="#fff" stroke="#2d4e91" stroke-width="5"/>
  <line x1="460" y1="157" x2="460" y2="1330" stroke="#2d4e91" stroke-width="5"/>
  <g font-family="Microsoft YaHei, sans-serif">
    <g transform="translate(120,190)"><rect width="680" height="150" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">接收管束设计上下文</text><text x="35" y="100" font-size="16" fill="#26364d">• 接收总 Agent / 数据空间路由的管束数据</text><text x="35" y="128" font-size="16" fill="#26364d">• 从数据库读取当前设备和前置模块参数</text></g>
    <g transform="translate(120,395)"><rect width="680" height="150" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">组装基础参数上下文</text><text x="35" y="100" font-size="16" fill="#26364d">• 按原程序优先级合并数据库值与产品默认值</text><text x="35" y="128" font-size="16" fill="#26364d">• 缺失元件信息时检索同型式、同 DN 历史产品</text></g>
    <g transform="translate(120,600)"><rect width="680" height="170" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">管束 Agent 识别与建议</text><text x="35" y="98" font-size="16" fill="#26364d">• 从流转资料识别管束候选参数，统一字段与单位</text><text x="35" y="126" font-size="16" fill="#26364d">• 对照基础值识别缺失、冲突和修改建议</text><text x="35" y="154" font-size="16" fill="#26364d">• 事实、冲突、建议均保留来源与置信信息</text></g>
    <g transform="translate(120,825)"><rect width="680" height="150" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">联动计算与确定性校验</text><text x="35" y="100" font-size="16" fill="#26364d">• 重算派生参数与上下游依赖</text><text x="35" y="128" font-size="16" fill="#26364d">• 错误定位到具体参数，未通过不能进入下一步</text></g>
    <g transform="translate(120,1030)"><rect width="680" height="160" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">人工审核与迭代修正</text><text x="35" y="94" font-size="16" fill="#26364d">• 管板型式 → 布管与元件 → 管-板连接 → 轴向设计</text><text x="35" y="120" font-size="16" fill="#26364d">• 错误标红并给出原因和推荐值，修改后循环重审</text><text x="35" y="146" font-size="16" fill="#26364d">• 全部通过后仍由用户确认才能进入下一步</text></g>
    <g transform="translate(120,1245)"><rect width="680" height="145" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">6</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">确认并存入数据库</text><text x="35" y="100" font-size="16" fill="#26364d">• 四阶段全部审核通过且用户确认后统一提交</text><text x="35" y="128" font-size="16" fill="#26364d">• 写入管束设计参数、元件信息、来源和审核记录</text></g>
  </g>
</svg>
