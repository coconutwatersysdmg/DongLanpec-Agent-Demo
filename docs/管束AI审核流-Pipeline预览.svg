<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1420" viewBox="0 0 920 1420">
  <rect width="920" height="1420" fill="#fff"/>
  <text x="80" y="60" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1f3763">管束 AI Agent · 人工审核 Pipeline</text>
  <text x="80" y="92" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5e6b7a">文件只提供证据候选 · AI 不能自行审核或写生产库</text>
  <circle cx="460" cy="135" r="22" fill="#fff" stroke="#2d4e91" stroke-width="5"/>
  <line x1="460" y1="157" x2="460" y2="1330" stroke="#2d4e91" stroke-width="5"/>
  <g font-family="Microsoft YaHei, sans-serif">
    <g transform="translate(120,190)"><rect width="680" height="150" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">接收与设备确认</text><text x="35" y="100" font-size="16" fill="#26364d">• 上传 PDF / XLSX / DOC / ZIP</text><text x="35" y="128" font-size="16" fill="#26364d">• 扫描多台设备，先由用户确认设备位号</text></g>
    <g transform="translate(120,395)"><rect width="680" height="150" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">装载基础数据</text><text x="35" y="100" font-size="16" fill="#26364d">• 模拟上游模块已保存参数</text><text x="35" y="128" font-size="16" fill="#26364d">• 按产品型式装载默认值，保留原程序优先级</text></g>
    <g transform="translate(120,600)"><rect width="680" height="170" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">管束 Agent 提取与建议</text><text x="35" y="98" font-size="16" fill="#26364d">• 检索当前设备证据，DeepSeek 提取结构化候选</text><text x="35" y="126" font-size="16" fill="#26364d">• 文件缺失时查询同型式、同 DN 历史建议</text><text x="35" y="154" font-size="16" fill="#26364d">• 事实、问题、冲突、建议分别标记</text></g>
    <g transform="translate(120,825)"><rect width="680" height="150" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">联动计算与规则校验</text><text x="35" y="100" font-size="16" fill="#26364d">• 重算派生参数与上下游依赖</text><text x="35" y="128" font-size="16" fill="#26364d">• 错误定位到具体参数，未通过不能进入下一步</text></g>
    <g transform="translate(120,1030)"><rect width="680" height="160" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">人工审核四个阶段</text><text x="35" y="100" font-size="16" fill="#26364d">• 管板型式 → 布管与元件 → 管-板连接 → 轴向设计</text><text x="35" y="130" font-size="16" fill="#26364d">• 错误标红并给推荐值；重审通过后还需用户确认</text></g>
    <g transform="translate(120,1245)"><rect width="680" height="145" rx="22" fill="#fff" stroke="#b9cbe9" stroke-width="2"/><path d="M22 0H658A22 22 0 0 1 680 22V68H0V22A22 22 0 0 1 22 0" fill="#edf4ff"/><circle cx="48" cy="34" r="23" fill="#2d4e91"/><text x="48" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">6</text><text x="90" y="42" font-size="21" font-weight="700" fill="#18233a">独立演示库提交</text><text x="35" y="100" font-size="16" fill="#26364d">• 四阶段全部通过后原子写入 SQLite</text><text x="35" y="128" font-size="16" fill="#26364d">• 记录版本和审计日志，不接触生产 MySQL</text></g>
  </g>
</svg>
